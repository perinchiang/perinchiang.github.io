<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>赛博朋克无限跑酷</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            background: #000;
            font-family: 'Courier New', monospace;
        }
        
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        
        #canvas-container {
            width: 100%;
            height: 100%;
        }
        
        #scoreboard {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, rgba(0, 255, 255, 0.1), rgba(255, 0, 255, 0.1));
            border: 2px solid #0ff;
            border-radius: 10px;
            padding: 15px 30px;
            color: #0ff;
            text-shadow: 0 0 10px #0ff, 0 0 20px #0ff;
            z-index: 100;
            backdrop-filter: blur(5px);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3), inset 0 0 20px rgba(0, 255, 255, 0.1);
        }
        
        #scoreboard h2 {
            font-size: 24px;
            margin-bottom: 10px;
            text-align: center;
            letter-spacing: 3px;
        }
        
        .score-item {
            display: flex;
            justify-content: space-between;
            margin: 5px 0;
            font-size: 18px;
        }
        
        .score-label {
            color: #f0f;
            text-shadow: 0 0 5px #f0f;
        }
        
        .score-value {
            color: #0ff;
            text-shadow: 0 0 5px #0ff;
            font-weight: bold;
        }
        
        #start-screen, #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
        }
        
        #game-over-screen {
            display: none;
        }
        
        .screen-title {
            font-size: 48px;
            color: #0ff;
            text-shadow: 0 0 20px #0ff, 0 0 40px #0ff;
            margin-bottom: 20px;
            letter-spacing: 5px;
        }
        
        .screen-subtitle {
            font-size: 24px;
            color: #f0f;
            text-shadow: 0 0 10px #f0f;
            margin-bottom: 30px;
        }
        
        .btn {
            padding: 15px 40px;
            font-size: 20px;
            background: transparent;
            border: 2px solid #0ff;
            color: #0ff;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 3px;
            transition: all 0.3s;
            box-shadow: 0 0 10px #0ff;
        }
        
        .btn:hover {
            background: #0ff;
            color: #000;
            box-shadow: 0 0 20px #0ff, 0 0 40px #0ff;
        }
        
        .controls {
            margin-top: 30px;
            color: #aaa;
            text-align: center;
            line-height: 1.8;
        }
        
        .key {
            display: inline-block;
            padding: 5px 10px;
            border: 1px solid #0ff;
            border-radius: 5px;
            color: #0ff;
            margin: 0 5px;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="canvas-container"></div>
        
        <div id="scoreboard">
            <h2>⚡ CYBER RUNNER ⚡</h2>
            <div class="score-item">
                <span class="score-label">距离:</span>
                <span class="score-value" id="distance">0m</span>
            </div>
            <div class="score-item">
                <span class="score-label">分数:</span>
                <span class="score-value" id="score">0</span>
            </div>
            <div class="score-item">
                <span class="score-label">速度:</span>
                <span class="score-value" id="speed">0 km/h</span>
            </div>
        </div>
        
        <div id="start-screen">
            <div class="screen-title">⚡ CYBER RUNNER ⚡</div>
            <div class="screen-subtitle">赛博朋克无限跑酷</div>
            <button class="btn" id="start-btn">开始游戏</button>
            <div class="controls">
                <p>控制方式:</p>
                <p><span class="key">A</span> 或 <span class="key">←</span> 左移</p>
                <p><span class="key">D</span> 或 <span class="key">→</span> 右移</p>
            </div>
        </div>
        
        <div id="game-over-screen">
            <div class="screen-title">GAME OVER</div>
            <div class="screen-subtitle">最终得分：<span id="final-score">0</span></div>
            <button class="btn" id="restart-btn">重新开始</button>
        </div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // 游戏配置
        const CONFIG = {
            laneWidth: 3,
            laneCount: 3,
            speed: 0.5,
            maxSpeed: 1.2,
            acceleration: 0.0001,
            segmentLength: 100,
            segmentCount: 10,
            obstacleSpawnRate: 0.3,
            fogDensity: 0.02,
            cameraHeight: 5,
            cameraDistance: 8
        };
        
        // 游戏状态
        let gameState = {
            isPlaying: false,
            distance: 0,
            score: 0,
            speed: CONFIG.speed,
            currentLane: 1,
            targetX: 0,
            segments: [],
            obstacles: []
        };
        
        // Three.js 变量
        let scene, camera, renderer;
        let car, roadGroup, obstacleGroup;
        let clock;
        
        // 初始化场景
        function init() {
            const container = document.getElementById('canvas-container');
            
            // 创建场景
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000011);
            scene.fog = new THREE.FogExp2(0x000011, CONFIG.fogDensity);
            
            // 创建相机
            camera = new THREE.PerspectiveCamera(
                75,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );
            camera.position.set(0, CONFIG.cameraHeight, CONFIG.cameraDistance);
            camera.lookAt(0, 0, -20);
            
            // 创建渲染器
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);
            
            // 添加灯光
            const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(10, 20, 10);
            scene.add(directionalLight);
            
            // 霓虹灯效果
            const pointLight1 = new THREE.PointLight(0x00ffff, 1, 50);
            pointLight1.position.set(-10, 5, -20);
            scene.add(pointLight1);
            
            const pointLight2 = new THREE.PointLight(0xff00ff, 1, 50);
            pointLight2.position.set(10, 5, -20);
            scene.add(pointLight2);
            
            // 创建道路组
            roadGroup = new THREE.Group();
            scene.add(roadGroup);
            
            // 创建障碍物组
            obstacleGroup = new THREE.Group();
            scene.add(obstacleGroup);
            
            // 创建汽车
            createCar();
            
            // 创建初始路段
            for (let i = 0; i < CONFIG.segmentCount; i++) {
                createRoadSegment(-i * CONFIG.segmentLength);
            }
            
            // 时钟
            clock = new THREE.Clock();
            
            // 事件监听
            window.addEventListener('resize', onWindowResize);
            document.addEventListener('keydown', handleKeyDown);
            document.getElementById('start-btn').addEventListener('click', startGame);
            document.getElementById('restart-btn').addEventListener('click', restartGame);
            
            // 开始渲染循环
            animate();
        }
        
        // 创建汽车
        function createCar() {
            car = new THREE.Group();
            
            // 车身
            const bodyGeometry = new THREE.BoxGeometry(1.5, 0.8, 3);
            const bodyMaterial = new THREE.MeshPhongMaterial({
                color: 0x00ffff,
                emissive: 0x004444,
                shininess: 100
            });
            const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
            body.position.y = 0.6;
            car.add(body);
            
            // 车顶
            const topGeometry = new THREE.BoxGeometry(1.2, 0.5, 1.5);
            const topMaterial = new THREE.MeshPhongMaterial({
                color: 0xff00ff,
                emissive: 0x440044,
                shininess: 100
            });
            const top = new THREE.Mesh(topGeometry, topMaterial);
            top.position.y = 1.3;
            top.position.z = -0.3;
            car.add(top);
            
            // 车轮
            const wheelGeometry = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 16);
            const wheelMaterial = new THREE.MeshPhongMaterial({
                color: 0x222222,
                emissive: 0x111111
            });
            
            const wheelPositions = [
                { x: -0.9, z: 1 },
                { x: 0.9, z: 1 },
                { x: -0.9, z: -1 },
                { x: 0.9, z: -1 }
            ];
            
            wheelPositions.forEach(pos => {
                const wheel = new THREE.Mesh(wheelGeometry, wheelMaterial);
                wheel.rotation.z = Math.PI / 2;
                wheel.position.set(pos.x, 0.4, pos.z);
                car.add(wheel);
            });
            
            // 尾灯
            const tailLightGeometry = new THREE.BoxGeometry(0.3, 0.2, 0.1);
            const tailLightMaterial = new THREE.MeshBasicMaterial({
                color: 0xff0000,
                transparent: true,
                opacity: 0.8
            });
            
            const tailLight1 = new THREE.Mesh(tailLightGeometry, tailLightMaterial);
            tailLight1.position.set(-0.5, 0.8, 1.5);
            car.add(tailLight1);
            
            const tailLight2 = new THREE.Mesh(tailLightGeometry, tailLightMaterial);
            tailLight2.position.set(0.5, 0.8, 1.5);
            car.add(tailLight2);
            
            // 发光效果
            const glowGeometry = new THREE.BoxGeometry(1.6, 0.1, 3.1);
            const glowMaterial = new THREE.MeshBasicMaterial({
                color: 0x00ffff,
                transparent: true,
                opacity: 0.3
            });
            const glow = new THREE.Mesh(glowGeometry, glowMaterial);
            glow.position.y = 0.1;
            car.add(glow);
            
            scene.add(car);
        }
        
        // 创建路段
        function createRoadSegment(zPosition) {
            const segment = new THREE.Group();
            
            // 路面
            const roadGeometry = new THREE.PlaneGeometry(
                CONFIG.laneWidth * CONFIG.laneCount + 2,
                CONFIG.segmentLength
            );
            const roadMaterial = new THREE.MeshPhongMaterial({
                color: 0x111111,
                emissive: 0x050505,
                side: THREE.DoubleSide
            });
            const road = new THREE.Mesh(roadGeometry, roadMaterial);
            road.rotation.x = -Math.PI / 2;
            road.position.z = zPosition - CONFIG.segmentLength / 2;
            segment.add(road);
            
            // 车道线
            const lineMaterial = new THREE.MeshBasicMaterial({
                color: 0x00ffff,
                transparent: true,
                opacity: 0.5
            });
            
            for (let i = 1; i < CONFIG.laneCount; i++) {
                const lineGeometry = new THREE.PlaneGeometry(0.1, CONFIG.segmentLength);
                const line = new THREE.Mesh(lineGeometry, lineMaterial);
                line.rotation.x = -Math.PI / 2;
                line.position.x = (i - CONFIG.laneCount / 2) * CONFIG.laneWidth;
                line.position.z = zPosition - CONFIG.segmentLength / 2;
                line.position.y = 0.01;
                segment.add(line);
            }
            
            // 路边霓虹灯
            const edgeLightGeometry = new THREE.BoxGeometry(0.2, 0.5, CONFIG.segmentLength);
            const edgeLightMaterial = new THREE.MeshBasicMaterial({
                color: 0xff00ff,
                transparent: true,
                opacity: 0.6
            });
            
            const leftEdge = new THREE.Mesh(edgeLightGeometry, edgeLightMaterial);
            leftEdge.position.x = -(CONFIG.laneWidth * CONFIG.laneCount / 2 + 1);
            leftEdge.position.z = zPosition - CONFIG.segmentLength / 2;
            leftEdge.position.y = 0.25;
            segment.add(leftEdge);
            
            const rightEdge = new THREE.Mesh(edgeLightGeometry, edgeLightMaterial);
            rightEdge.position.x = CONFIG.laneWidth * CONFIG.laneCount / 2 + 1;
            rightEdge.position.z = zPosition - CONFIG.segmentLength / 2;
            rightEdge.position.y = 0.25;
            segment.add(rightEdge);
            
            roadGroup.add(segment);
            gameState.segments.push({
                mesh: segment,
                zPosition: zPosition
            });
            
            // 生成障碍物
            if (zPosition < -CONFIG.segmentLength && Math.random() < CONFIG.obstacleSpawnRate) {
                spawnObstacle(zPosition);
            }
        }
        
        // 生成障碍物
        function spawnObstacle(zPosition) {
            const lane = Math.floor(Math.random() * CONFIG.laneCount);
            const xPos = (lane - (CONFIG.laneCount - 1) / 2) * CONFIG.laneWidth;
            
            const obstacleType = Math.random();
            let geometry, material, mesh;
            
            if (obstacleType < 0.5) {
                // 立方体障碍
                geometry = new THREE.BoxGeometry(2, 2, 2);
                material = new THREE.MeshPhongMaterial({
                    color: 0xff0000,
                    emissive: 0x440000,
                    shininess: 100
                });
                mesh = new THREE.Mesh(geometry, material);
                mesh.position.set(xPos, 1, zPosition - Math.random() * CONFIG.segmentLength * 0.8);
            } else {
                // 锥形障碍
                geometry = new THREE.ConeGeometry(1, 2, 8);
                material = new THREE.MeshPhongMaterial({
                    color: 0xffaa00,
                    emissive: 0x442200,
                    shininess: 100
                });
                mesh = new THREE.Mesh(geometry, material);
                mesh.position.set(xPos, 1, zPosition - Math.random() * CONFIG.segmentLength * 0.8);
            }
            
            // 添加发光效果
            const glowGeometry = new THREE.BoxGeometry(2.2, 2.2, 2.2);
            const glowMaterial = new THREE.MeshBasicMaterial({
                color: 0xff0000,
                transparent: true,
                opacity: 0.2
            });
            const glow = new THREE.Mesh(glowGeometry, glowMaterial);
            mesh.add(glow);
            
            obstacleGroup.add(mesh);
            gameState.obstacles.push({
                mesh: mesh,
                lane: lane,
                active: true
            });
        }
        
        // 处理键盘输入
        function handleKeyDown(event) {
            if (!gameState.isPlaying) return;
            
            if (event.key === 'a' || event.key === 'A' || event.key === 'ArrowLeft') {
                if (gameState.currentLane > 0) {
                    gameState.currentLane--;
                }
            } else if (event.key === 'd' || event.key === 'D' || event.key === 'ArrowRight') {
                if (gameState.currentLane < CONFIG.laneCount - 1) {
                    gameState.currentLane++;
                }
            }
            
            gameState.targetX = (gameState.currentLane - (CONFIG.laneCount - 1) / 2) * CONFIG.laneWidth;
        }
        
        // 更新汽车位置
        function updateCar(deltaTime) {
            // 平滑移动到目标车道
            car.position.x += (gameState.targetX - car.position.x) * 10 * deltaTime;
            
            // 限制在汽车范围内
            car.position.x = Math.max(
                -(CONFIG.laneCount - 1) / 2 * CONFIG.laneWidth - 1,
                Math.min((CONFIG.laneCount - 1) / 2 * CONFIG.laneWidth + 1, car.position.x)
            );
            
            // 倾斜效果
            car.rotation.z = (car.position.x - gameState.targetX) * 0.1;
            car.rotation.y = -(car.position.x - gameState.targetX) * 0.05;
        }
        
        // 更新摄像机
        function updateCamera(deltaTime) {
            // 根据汽车位置和赛道曲率调整摄像机
            const targetCameraX = car.position.x * 0.3;
            camera.position.x += (targetCameraX - camera.position.x) * 3 * deltaTime;
            
            // 轻微晃动效果
            const time = Date.now() * 0.001;
            camera.position.y = CONFIG.cameraHeight + Math.sin(time * 2) * 0.1;
            camera.position.z = CONFIG.cameraDistance + Math.cos(time * 1.5) * 0.1;
            
            // 摄像机始终看向汽车前方
            camera.lookAt(car.position.x * 0.2, 0, -30);
        }
        
        // 更新路段
        function updateSegments() {
            // 移除超出范围的路段
            gameState.segments = gameState.segments.filter(segment => {
                if (segment.zPosition > car.position.z + CONFIG.segmentLength * 2) {
                    roadGroup.remove(segment.mesh);
                    return false;
                }
                return true;
            });
            
            // 添加新路段
            const lastSegment = gameState.segments[gameState.segments.length - 1];
            if (lastSegment && lastSegment.zPosition > car.position.z - CONFIG.segmentLength * (CONFIG.segmentCount - 1)) {
                createRoadSegment(lastSegment.zPosition - CONFIG.segmentLength);
            }
        }
        
        // 更新障碍物
        function updateObstacles() {
            gameState.obstacles = gameState.obstacles.filter(obstacle => {
                if (obstacle.mesh.position.z > car.position.z + 10) {
                    obstacleGroup.remove(obstacle.mesh);
                    return false;
                }
                return true;
            });
            
            // 碰撞检测
            const carBox = new THREE.Box3().setFromObject(car);
            carBox.expandByScalar(-0.2);
            
            gameState.obstacles.forEach(obstacle => {
                if (!obstacle.active) return;
                
                const obstacleBox = new THREE.Box3().setFromObject(obstacle.mesh);
                if (carBox.intersectsBox(obstacleBox)) {
                    gameOver();
                }
            });
        }
        
        // 更新分数板
        function updateScoreboard() {
            document.getElementById('distance').textContent = Math.floor(gameState.distance) + 'm';
            document.getElementById('score').textContent = Math.floor(gameState.score);
            document.getElementById('speed').textContent = Math.floor(gameState.speed * 200) + ' km/h';
        }
        
        // 开始游戏
        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            gameState.isPlaying = true;
            gameState.distance = 0;
            gameState.score = 0;
            gameState.speed = CONFIG.speed;
            gameState.currentLane = 1;
            gameState.targetX = 0;
            car.position.x = 0;
            car.position.z = 0;
        }
        
        // 游戏结束
        function gameOver() {
            gameState.isPlaying = false;
            document.getElementById('final-score').textContent = Math.floor(gameState.score);
            document.getElementById('game-over-screen').style.display = 'flex';
        }
        
        // 重新开始
        function restartGame() {
            // 清理障碍物
            gameState.obstacles.forEach(obstacle => {
                obstacleGroup.remove(obstacle.mesh);
            });
            gameState.obstacles = [];
            
            // 重置路段
            gameState.segments.forEach(segment => {
                roadGroup.remove(segment.mesh);
            });
            gameState.segments = [];
            
            // 重新创建初始路段
            for (let i = 0; i < CONFIG.segmentCount; i++) {
                createRoadSegment(-i * CONFIG.segmentLength);
            }
            
            document.getElementById('game-over-screen').style.display = 'none';
            gameState.isPlaying = true;
            gameState.distance = 0;
            gameState.score = 0;
            gameState.speed = CONFIG.speed;
            gameState.currentLane = 1;
            gameState.targetX = 0;
            car.position.x = 0;
            car.position.z = 0;
        }
        
        // 窗口大小调整
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            
            const deltaTime = clock.getDelta();
            
            if (gameState.isPlaying) {
                // 更新游戏状态
                gameState.distance += gameState.speed * 10;
                gameState.score += gameState.speed;
                gameState.speed = Math.min(CONFIG.maxSpeed, gameState.speed + CONFIG.acceleration);
                
                // 移动汽车（实际上是移动世界）
                car.position.z -= gameState.speed;
                
                // 更新各个组件
                updateCar(deltaTime);
                updateCamera(deltaTime);
                updateSegments();
                updateObstacles();
                updateScoreboard();
            }
            
            renderer.render(scene, camera);
        }
        
        // 初始化
        init();
    </script>
</body>
</html>
